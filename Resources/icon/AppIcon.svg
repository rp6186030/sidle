<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f3a"/><stop offset="1" stop-color="#12141a"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5060"/><stop offset="1" stop-color="#343946"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-50%" width="500%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <clipPath id="padclip"><rect x="182" y="262" width="660" height="500" rx="64"/></clipPath>
  </defs>
  <!-- macOS icon grid: 824px squircle centred in 1024 -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  <!-- trackpad -->
  <rect x="182" y="262" width="660" height="500" rx="64" fill="url(#pad)"/>
  <rect x="183" y="263" width="658" height="498" rx="63" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="2"/>
  <g clip-path="url(#padclip)">
    <!-- glowing right edge -->
    <rect x="752" y="262" width="90" height="500" fill="url(#strip)" opacity=".55" filter="url(#glow)"/>
    <rect x="772" y="262" width="70" height="500" fill="url(#strip)"/>
    <!-- level ticks -->
    <g fill="#12141a" fill-opacity=".45">
      <rect x="790" y="350" width="34" height="8" rx="4"/><rect x="790" y="430" width="34" height="8" rx="4"/>
      <rect x="790" y="510" width="34" height="8" rx="4"/><rect x="790" y="590" width="34" height="8" rx="4"/>
      <rect x="790" y="670" width="34" height="8" rx="4"/>
    </g>
  </g>
  <!-- finger dot with slide trail -->
  <rect x="783" y="420" width="48" height="190" rx="24" fill="#ffffff" fill-opacity=".35"/>
  <circle cx="807" cy="444" r="34" fill="#ffffff"/>
</svg>
